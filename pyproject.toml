[project]
name = "ela-data-warehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg2-binary==2.9.9",
  "requests==2.32.3",
  "PyYAML==6.0.2",
  "openpyxl==3.1.5",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
